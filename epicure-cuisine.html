<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuisine & produits — Epicure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #241012;
    --panel: #2E1518;
    --panel-raised: #3A1B1E;
    --ink: #F1E6D3;
    --ink-soft: #D8C6AE;
    --gold: #C9A227;
    --gold-bright: #E8C765;
    --muted: #8C6F52;
    --rule: rgba(201,162,39,0.25);
    --dim: #6B4F45;
    --sage: #7E9C6E;
    --radius: 10px;
    --shadow: 0 14px 34px rgba(10,4,5,0.45);
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Work Sans', sans-serif;
  }
 
  *{ box-sizing: border-box; }
 
  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
 
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(2.5rem, 6vw, 5rem) clamp(1.25rem, 4vw, 2rem);
  }
 
  a{ color: inherit; }
 
  .page{
    width: 100%;
    max-width: 1080px;
  }
 
  header.masthead{
    text-align:center;
    margin-bottom: clamp(2rem, 5vw, 3rem);
  }
 
  .kicker{
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.6rem;
  }
  .kicker a{
    text-decoration: none;
    border-bottom: 1px solid rgba(140,111,82,0.4);
  }
  .kicker a:hover{ color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
 
  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.2rem, 5.2vw, 3.1rem);
    margin: 0 0 0.9rem;
    color: var(--ink);
  }
 
  .lede{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.08rem;
    color: var(--ink-soft);
    max-width: 52ch;
    margin: 0 auto;
    line-height: 1.55;
  }
 
  /* --- Gallery groups --- */
 
  .group{ margin-top: 2.6rem; }
  .group-head{
    display:flex;
    align-items: baseline;
    gap: 0.7rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .group-head h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.55rem;
    margin: 0;
    color: var(--gold-bright);
  }
  .group-head .count{
    font-size: 0.78rem;
    color: var(--dim);
  }
 
  .gallery{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.1rem;
  }
 
  .card{
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: rgba(201,162,39,0.55);
  }
 
  .card-cover{
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    filter: sepia(10%) saturate(105%);
    background: var(--panel-raised);
  }
 
  .card-cover.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 2.6rem;
    color: var(--dim);
    background:
      repeating-linear-gradient(135deg, var(--panel-raised), var(--panel-raised) 10px, var(--panel) 10px, var(--panel) 20px);
  }
 
  .card-body{ padding: 0.85rem 1rem 1rem; }
 
  .card-tag{
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 0.25rem;
  }
 
  .card-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0 0 0.2rem;
    color: var(--ink);
    line-height: 1.2;
  }
 
  .card-terroir{
    font-size: 0.78rem;
    font-style: italic;
    color: var(--muted);
    margin: 0;
  }
 
  /* --- Modal --- */
 
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(12,5,6,0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    z-index: 999;
  }
  .overlay.open{ display: flex; }
 
  .modal{
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
 
  .modal-close{
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: var(--ink);
    border: none;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
    z-index: 2;
  }
  .modal-close:hover{ background: var(--gold-bright); color: var(--bg); }
 
  .modal-cover{
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    display: block;
    filter: sepia(10%) saturate(105%);
  }
  .modal-cover.placeholder{
    height: 200px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 3.4rem;
    color: var(--dim);
    background:
      repeating-linear-gradient(135deg, var(--panel-raised), var(--panel-raised) 12px, var(--panel) 12px, var(--panel) 24px);
  }
 
  .modal-body{ padding: 1.6rem 1.8rem 2rem; }
 
  .modal-breadcrumb{
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 0.5rem;
  }
 
  .modal-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0 0 0.4rem;
    color: var(--ink);
  }
 
  .modal-terroir{
    font-size: 0.9rem;
    font-style: italic;
    color: var(--muted);
    margin: 0 0 1.1rem;
  }
 
  .modal-text{
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0;
  }
  .modal-text.placeholder{ color: var(--dim); font-style: italic; }
 
  footer.colophon{
    margin-top: 3rem;
    text-align:center;
    font-size: 0.78rem;
    color: var(--dim);
  }
</style>
</head>
<body>
 
<div class="page">
  <header class="masthead">
    <p class="kicker"><a href="index.html">Epicure</a> — gastronomie, cuisine, œnologie, mixologie</p>
    <h1>Cuisine &amp; produits</h1>
    <p class="lede">Recettes mises à l'épreuve, produits dénichés au fil des saisons. Touchez une fiche pour l'ouvrir.</p>
  </header>
 
  <div id="gallery-root"></div>
 
  <footer class="colophon">Une facette de l'Atlas des facettes.</footer>
</div>
 
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-content"></div>
  </div>
</div>
 
<script>
  const PRODUCTS = [
    {
      id: "castelas",
      categorie: "Épicerie salée",
      sousCategorie: "Huile d'olive",
      titre: "Les huiles d'olive du Moulin Castelas",
      terroir: "AOP Vallée des Baux-de-Provence",
      image: "https://lucasrouer.github.io/epicure/photos/huile-castelas.jpg",
      texte: "Notes à rédiger : les cuvées, les saveurs, la provenance, et mon goût sur chacune."
    },
    {
      id: "fallot",
      categorie: "Épicerie salée",
      sousCategorie: "Moutarde",
      titre: "Les moutardes Edmond Fallot",
      terroir: "Beaune, Bourgogne - meule de pierre",
      image: "https://lucasrouer.github.io/epicure/photos/moutarde-fallot.jpeg",
      texte: "Notes à rédiger."
    },
    {
      id: "belle-iloise",
      categorie: "Épicerie salée",
      sousCategorie: "Conserve",
      titre: "La conserverie La Belle-Iloise",
      terroir: "Quiberon, Bretagne",
      image: "https://lucasrouer.github.io/epicure/photos/conserverie-iloise.jpg",
      texte: "Notes à rédiger."
    },
    {
      id: "miel",
      categorie: "Épicerie sucrée",
      sousCategorie: "Miel",
      titre: "Sélection de miel",
      terroir: "",
      image: "",
      texte: "Notes à rédiger."
    },
    {
      id: "fromages",
      categorie: "Fromage",
      sousCategorie: "",
      titre: "Sélection de fromages",
      terroir: "",
      image: "",
      texte: "Notes à rédiger."
    },
    {
      id: "poissons",
      categorie: "Poisson",
      sousCategorie: "",
      titre: "Sélection de poissons",
      terroir: "",
      image: "",
      texte: "Notes à rédiger."
    },
    {
      id: "viandes",
      categorie: "Viande",
      sousCategorie: "",
      titre: "Sélection de viandes",
      terroir: "",
      image: "",
      texte: "Notes à rédiger."
    },
    {
      id: "riz-sushi",
      categorie: "Recette",
      sousCategorie: "Riz",
      titre: "Cuire le riz à sushi",
      terroir: "Japon — sushis, makis, bento",
      image: "",
      texte: "Rincez 300 g de riz rond japonais à l'eau claire jusqu'à ce qu'elle reste limpide, puis laissez-le égoutter une vingtaine de minutes. Faites-le cuire à couvert dans 350 ml d'eau, à feu doux, jusqu'à absorption complète (environ 12 minutes), puis laissez reposer 10 minutes sans soulever le couvercle. Pendant ce temps, faites tiédir 4 cuillères à soupe de vinaigre de riz avec 2 cuillères à soupe de sucre et une cuillère à café de sel, jusqu'à dissolution, sans faire bouillir. Étalez le riz chaud dans un grand plat, idéalement en bois, puis versez l'assaisonnement petit à petit en mélangeant délicatement à la spatule et en éventant le riz pour qu'il refroidisse sans devenir collant. À utiliser tiède, jamais froid, pour sushis, makis ou bento. (Inspiré de la recette de riz japonais au vinaigre de Marmiton.)"
    },
    {
      id: "carbonara",
      categorie: "Recette",
      sousCategorie: "Pâtes",
      titre: "Les vrais carbonaras",
      terroir: "Rome, Italie — sans crème",
      image: "",
      texte: "Recette à rédiger."
    },
    {
      id: "truffade",
      categorie: "Recette",
      sousCategorie: "Plat régional",
      titre: "La truffade auvergnate",
      terroir: "Cantal, Auvergne",
      image: "",
      texte: "Recette à rédiger."
    }
  ];
 
  const GROUP_ORDER = ["Épicerie salée","Épicerie sucrée","Fromage","Poisson","Viande","Recette"];
 
  const root = document.getElementById('gallery-root');
  const overlay = document.getElementById('overlay');
  const modalContent = document.getElementById('modal-content');
 
  function initial(str){ return str.trim().charAt(0).toUpperCase(); }
 
  function renderGallery(){
    GROUP_ORDER.forEach(cat => {
      const items = PRODUCTS.filter(p => p.categorie === cat);
      if (!items.length) return;
 
      const group = document.createElement('section');
      group.className = 'group';
 
      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = '<h2>' + cat + '</h2><span class="count">' + items.length + '</span>';
      group.appendChild(head);
 
      const grid = document.createElement('div');
      grid.className = 'gallery';
 
      items.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.addEventListener('click', () => openModal(p.id));
 
        if (p.image) {
          const img = document.createElement('img');
          img.className = 'card-cover';
          img.src = p.image;
          img.alt = p.titre;
          card.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'card-cover placeholder';
          ph.textContent = initial(p.titre);
          card.appendChild(ph);
        }
 
        const body = document.createElement('div');
        body.className = 'card-body';
        let html = '';
        if (p.sousCategorie) html += '<p class="card-tag">' + p.sousCategorie + '</p>';
        html += '<h3 class="card-title">' + p.titre + '</h3>';
        if (p.terroir) html += '<p class="card-terroir">' + p.terroir + '</p>';
        body.innerHTML = html;
        card.appendChild(body);
 
        grid.appendChild(card);
      });
 
      group.appendChild(grid);
      root.appendChild(group);
    });
  }
 
  function openModal(id){
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
 
    let html = '';
    if (p.image) {
      html += '<img class="modal-cover" src="' + p.image + '" alt="' + p.titre + '">';
    } else {
      html += '<div class="modal-cover placeholder">' + initial(p.titre) + '</div>';
    }
    html += '<div class="modal-body">';
    html += '<p class="modal-breadcrumb">' + p.categorie + (p.sousCategorie ? ' — ' + p.sousCategorie : '') + '</p>';
    html += '<h2 class="modal-title">' + p.titre + '</h2>';
    if (p.terroir) html += '<p class="modal-terroir">' + p.terroir + '</p>';
    html += '<p class="modal-text ' + (p.texte.includes('à rédiger') ? 'placeholder' : '') + '">' + p.texte + '</p>';
    html += '</div>';
 
    modalContent.innerHTML = html;
    overlay.classList.add('open');
  }
 
  function closeModal(){
    overlay.classList.remove('open');
  }
 
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
 
  renderGallery();
</script>
 
</body>
</html>
